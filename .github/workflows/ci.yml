name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tests → lint → typecheck → production build → demo build → dist secret scan
      - run: npm run quality:gate
        # Placeholder config, like a configured Netlify site: the build must
        # work with it, and the test suite must not be affected by it.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
          COACH_ALLOWED_USER_ID: 00000000-0000-0000-0000-000000000000
          OLLAMA_API_KEY: ci-placeholder
          STRAVA_WEBHOOK_SUBSCRIPTION_ID: "999"
          TOKEN_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItY2ktcGxhY2Vob2xkZXItMDA=

  e2e:
    name: Browser smoke (guest mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
