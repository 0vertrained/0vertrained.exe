name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tests → lint → typecheck → production build → demo build → dist secret scan
      - run: npm run quality:gate
        # Placeholder config, like a configured Netlify site: the build must
        # work with it, and the test suite must not be affected by it.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
          COACH_ALLOWED_USER_ID: 00000000-0000-0000-0000-000000000000
          OLLAMA_API_KEY: ci-placeholder
          STRAVA_WEBHOOK_SUBSCRIPTION_ID: "999"
          TOKEN_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItY2ktcGxhY2Vob2xkZXItMDA=

  e2e:
    name: Browser smoke (guest mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    name: Database and accounts (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The new schema: start a local stack from supabase/v20 and run its pgTAP tests.
      - run: supabase start --workdir supabase/v20/cli
      - run: supabase test db --workdir supabase/v20/cli
      # Build the app against the local project and run the account specs.
      # `status -o env` prints KEY="value" lines: source them (the shell strips
      # the quotes) rather than appending them to GITHUB_ENV verbatim. Newer
      # CLIs issue sb_publishable_ keys and may omit the legacy anon JWT, so
      # take whichever is present.
      - name: Read the local keys
        run: |
          supabase status --workdir supabase/v20/cli -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          key="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$key" ]; then
            echo "status output lacks API_URL or a client key; variables printed:" >&2
            sed 's/=.*//' "$RUNNER_TEMP/supabase.env" >&2
            exit 1
          fi
          echo "LOCAL_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "LOCAL_CLIENT_KEY=$key" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_NEXT_SUPABASE_URL: ${{ env.LOCAL_API_URL }}
          VITE_NEXT_SUPABASE_ANON_KEY: ${{ env.LOCAL_CLIENT_KEY }}
      - run: npm run test:e2e -- e2e/account.spec.ts --project=mobile
        env:
          E2E_ACCOUNTS: "1"
      - run: supabase stop --workdir supabase/v20/cli
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-db
          path: playwright-report/
          retention-days: 7
