version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for routine updates instead of one per package.
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    # Major upgrades (e.g. vitest 4 → 5) change APIs; do them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    # Hijacked releases are usually caught and pulled within days, so wait a
    # week before proposing one.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
