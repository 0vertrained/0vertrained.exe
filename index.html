<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- V12.1 · user-scalable=no / maximum-scale removed: it was a WCAG 1.4.4
         failure that modern iOS Safari ignores anyway, so it only ever blocked
         pinch-zoom on Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color matches the page colour of the light and dark themes
         (--bg in src/ledger.css). Browsers without media-query support on
         theme-color fall back to the first tag. -->
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)" />
    <!-- Landing/SEO meta. The description mirrors the home page. -->
    <meta name="description" content="0VERTRAINED is a private training ledger for people who lift and run. Log or import your training, recovery and food, and get one evidence-based answer each morning: how hard should today be?" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="0VERTRAINED: how hard should today be?" />
    <meta property="og:description" content="A private training ledger for people who lift and run. Log or import your training, recovery and food, and get one evidence-based answer each morning." />
    <!-- CSP is managed in netlify.toml headers. Do not duplicate it here; browsers enforce all CSP policies, so stale meta CSP can block Cloud Run/media even when Netlify headers are correct. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="0VERTRAINED" />

    <!-- Favicon — ICO with BMP encoding, most compatible with Safari -->
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />

    <!-- iPhone home screen icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- V12.1 · Fonts are self-hosted via @fontsource (see src/fonts.js) —
         same families/weights the Google Fonts request carried, now served
         from /assets with immutable caching. Removes the render-blocking
         third-party request and lets the CSP drop Google's font domains. -->
    <title>0VERTRAINED</title>
  </head>
  <body>
    <div id="root">
      <!-- V13.2 · No-JS fallback: the SPA renders blank without JavaScript,
           so the app description and the privacy-policy link stay reachable
           here. React replaces this on mount. -->
      <noscript>
        <div style="max-width: 640px; margin: 48px auto; padding: 0 20px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1A1A1A; line-height: 1.6;">
          <h1 style="font-size: 22px; letter-spacing: .05em;">0VERTRAINED</h1>
          <p>0VERTRAINED is a private training ledger for people who lift and run. You log or import your training, recovery and food, and each morning the app answers one question: how hard should today be?</p>
          <p>With your permission, optional integrations (Oura, Whoop, Strava) import health and activity data used only to power the recovery, readiness, and training features you see in the app.</p>
          <p>JavaScript is required to use the app. <a href="/legal/privacy-policy.html">Privacy policy</a> · <a href="/legal/terms-of-service.html">Terms of service</a></p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
