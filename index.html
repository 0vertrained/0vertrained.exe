<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- V12.1 · user-scalable=no / maximum-scale removed: it was a WCAG 1.4.4
         failure that modern iOS Safari ignores anyway, so it only ever blocked
         pinch-zoom on Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- V13.2 · theme-color updated from the retired terminal palette to the
         Whitepaper stocks (paper / dark stock). Browsers without media-query
         support on theme-color fall back to the first tag. -->
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <!-- Google Search Console domain verification — required for OAuth app
         verification (authorized-domain ownership). DO NOT REMOVE. -->
    <meta name="google-site-verification" content="r-SApNWlGYvjjddS8aw7qAFzbWfBicwDw94nR6_kfrQ" />
    <!-- V13.2 · Landing/SEO meta. The description mirrors the on-page Abstract. -->
    <meta name="description" content="0VERTRAINED is a private training ledger for hybrid athletes: log or import training, recovery, and nutrition data, and get one evidence-based verdict on how hard to train today." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="0VERTRAINED — Train hard. Recover honestly." />
    <meta property="og:description" content="A private training ledger for hybrid athletes. Log or import training, recovery, and nutrition, and get one verdict on how hard to train today." />
    <!-- CSP is managed in netlify.toml headers. Do not duplicate it here; browsers enforce all CSP policies, so stale meta CSP can block Cloud Run/media even when Netlify headers are correct. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="0VERTRAINED" />

    <!-- Favicon — ICO with BMP encoding, most compatible with Safari -->
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />

    <!-- iPhone home screen icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- V12.1 · Fonts are self-hosted via @fontsource (see src/fonts.js) —
         same families/weights the Google Fonts request carried, now served
         from /assets with immutable caching. Removes the render-blocking
         third-party request and lets the CSP drop Google's font domains. -->
    <title>0VERTRAINED</title>
  </head>
  <body>
    <div id="root">
      <!-- V13.2 · No-JS fallback: the SPA renders blank without JavaScript,
           and Google's homepage review requires the app description and a
           privacy-policy link to be reachable. React replaces this on mount. -->
      <noscript>
        <div style="max-width: 640px; margin: 48px auto; padding: 0 20px; font-family: Georgia, 'Times New Roman', serif; color: #1A1A1A; line-height: 1.6;">
          <h1 style="font-family: 'Courier New', monospace; font-size: 20px; letter-spacing: -0.01em;">0VERTRAINED</h1>
          <p>0VERTRAINED is a private training ledger for hybrid athletes. You log strength, cardio, nutrition, body metrics, and daily recovery check-ins — or import them from a wearable — and the app reconciles training load against sleep, HRV, and fueling to answer one question each morning: how hard should today be?</p>
          <p>With your permission, optional integrations (Oura, Whoop, Fitbit by Google, Strava) import health and activity data used only to power the recovery, readiness, and training features you see in the app. 0VERTRAINED's use and transfer to any other app of information received from Google APIs will adhere to the <a href="https://developers.google.com/terms/api-services-user-data-policy">Google API Services User Data Policy</a>, including the Limited Use requirements.</p>
          <p>JavaScript is required to use the app. <a href="/legal/privacy-policy.html">Privacy policy</a> · <a href="/legal/terms-of-service.html">Terms of service</a></p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
